<!DOCTYPE html>
<html lang="ro">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLXPD4ND09"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BLXPD4ND09');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghid Județ — Drumuri bune</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <div id="site-header"></div>

  <main class="flex-1 mx-auto w-full max-w-4xl px-4 py-6 sm:px-6 sm:py-10">
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-xs font-medium text-[var(--muted-foreground)]">
      <a href="index.html" class="hover:text-[var(--primary)]">Harta</a>
      <span>/</span>
      <a href="sectoare.html" class="hover:text-[var(--primary)]">Sectoare</a>
      <span>/</span>
      <span id="county-breadcrumb" class="font-semibold text-[var(--foreground)]"></span>
    </nav>

    <!-- Header Details -->
    <div class="mt-4 flex flex-wrap items-baseline justify-between gap-4 border-b border-[var(--border)] pb-6">
      <div>
        <div class="flex items-center gap-2">
          <h1 id="county-name" class="text-4xl font-bold tracking-tight text-[var(--primary)]"></h1>
          <span id="county-sector-badge" class="rounded-md bg-[var(--secondary)] px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider text-[var(--accent)]"></span>
        </div>
        <p id="county-intro" class="mt-3 text-lg leading-relaxed text-[var(--muted-foreground)]"></p>
      </div>
    </div>

    <!-- Highlights -->
    <section class="mt-8">
      <h2 class="text-sm font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Repere turistice principale</h2>
      <ul id="county-highlights" class="mt-3 grid gap-3 sm:grid-cols-3">
        <!-- Rendered dynamically -->
      </ul>
    </section>

    <!-- Articles Section -->
    <section class="mt-12">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold">Articole turistice</h2>
        <span id="articles-count-badge" class="text-xs text-[var(--muted-foreground)]"></span>
      </div>

      <div id="county-articles-grid" class="mt-6 grid gap-5 sm:grid-cols-3">
        <!-- Rendered dynamically -->
      </div>

      <!-- UGC Invitation Banner for this County -->
      <div class="mt-8 rounded-xl border border-dashed border-[var(--primary)]/40 bg-[var(--primary)]/5 p-5 sm:p-6 sm:flex sm:items-center sm:justify-between gap-4">
        <div>
          <span class="inline-block rounded-md bg-[var(--secondary)] px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider text-[var(--primary)]">Comunitate</span>
          <h3 class="mt-1 text-base sm:text-lg font-bold text-[var(--foreground)]">Cunoști un loc special sau o rețetă din acest județ?</h3>
          <p class="mt-0.5 text-xs text-[var(--muted-foreground)]">Trimite propriul articol. După aprobarea în Centrul de Control, va fi publicat în acest ghid.</p>
        </div>
        <button id="btn-ugc-county" type="button" class="mt-3 sm:mt-0 inline-flex items-center gap-1.5 rounded-lg bg-[var(--primary)] px-4 py-2 text-xs font-semibold text-white shadow-xs hover:bg-[var(--primary-hover)] shrink-0 cursor-pointer transition-all">
          <span>✍️ Propune articol</span>
        </button>
      </div>
    </section>

    <div class="mt-14 border-t border-[var(--border)] pt-6">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-[var(--primary)] hover:underline">
        ← Înapoi la harta interactivă
      </a>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/romania-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      renderSiteHeader("harta");
      renderSiteFooter();

      const slug = getParam("judet") || "cluj";
      const cObj = AppStore.getCountyObj(slug);
      const name = cObj ? cObj.name : slug;
      const note = window.COUNTY_NOTES ? window.COUNTY_NOTES[slug] : null;
      const sec = AppStore.getSectorByCounty(slug);

      document.title = `${name} — Drumuri bune`;
      document.getElementById("county-breadcrumb").textContent = name;
      document.getElementById("county-name").textContent = name;
      document.getElementById("county-sector-badge").textContent = sec ? `Sector ${sec.name}` : "";
      document.getElementById("county-intro").textContent = note && note.intro ? note.intro : "";

      // Highlights
      const hList = document.getElementById("county-highlights");
      if (note && note.highlights && note.highlights.length > 0) {
        hList.innerHTML = note.highlights.map(h => `
          <li class="flex items-start gap-2.5 rounded-lg border border-[var(--border)] bg-white p-3.5 text-xs font-medium text-[var(--foreground)] shadow-xs">
            <span class="mt-0.5 text-[var(--primary)]">📍</span>
            <span>${h}</span>
          </li>
        `).join("");
      } else {
        hList.innerHTML = `<li class="text-xs text-[var(--muted-foreground)]">Fără repere adăugate încă.</li>`;
      }

      function renderArticles() {
        const articles = AppStore.getCountyArticles(slug);
        document.getElementById("articles-count-badge").textContent = `${articles.length} articole publicate`;

        const grid = document.getElementById("county-articles-grid");

        if (articles.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full rounded-xl border border-dashed border-[var(--border)] bg-[var(--secondary)]/30 p-8 text-center">
              <span class="text-3xl">✍️</span>
              <h3 class="mt-2 text-base sm:text-lg font-bold text-[var(--foreground)]">Nu există încă articole pentru județul ${name}</h3>
              <p class="mt-1 text-xs sm:text-sm text-[var(--muted-foreground)]">Fii primul care propune o recomandare, un monument istoric sau un traseu din această zonă.</p>
              <button type="button" onclick="window.openUgcModal('${slug}')" class="mt-4 inline-flex items-center gap-1.5 rounded-lg bg-[var(--primary)] px-4 py-2 text-xs sm:text-sm font-semibold text-white shadow-xs hover:bg-[var(--primary-hover)] cursor-pointer">
                <span>✍️ Propune primul articol</span>
              </button>
            </div>
          `;
          return;
        }

        grid.innerHTML = articles.map(art => {
          const cardImg = art.imageUrl || (typeof window.getDefaultArticleImage === "function" ? window.getDefaultArticleImage(art.topicSlug || art.slug) : "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop");
          return `
            <a href="articol.html?judet=${slug}&slug=${art.slug}" class="group flex flex-col justify-between overflow-hidden rounded-xl border border-[var(--border)] bg-white shadow-xs transition-all hover:border-[var(--primary)] hover:shadow-md text-decoration-none">
              <div class="relative h-44 w-full overflow-hidden bg-[var(--secondary)]">
                <img src="${cardImg}" alt="${art.title}" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop';" />
                <span class="absolute top-2.5 left-2.5 rounded-md bg-black/60 px-2.5 py-0.5 text-[10px] font-bold uppercase text-white tracking-wider backdrop-blur-xs">${art.topicLabel || "Ghid"}</span>
                ${art.isUgc ? `<span class="absolute top-2.5 right-2.5 rounded bg-amber-500 text-white px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider">UGC</span>` : ""}
              </div>
              <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                  <h3 class="text-base font-bold text-[var(--foreground)] group-hover:text-[var(--primary)] transition-colors line-clamp-2">${art.title}</h3>
                  <p class="mt-2 text-xs leading-relaxed text-[var(--muted-foreground)] line-clamp-3">${art.excerpt}</p>
                </div>
                <div class="mt-4 flex items-center justify-between border-t border-[var(--border)] pt-3 text-xs font-medium text-[var(--primary)]">
                  <span class="text-[var(--muted-foreground)]">🕒 ${art.readMinutes} min lectură</span>
                  <span class="font-semibold">Citește →</span>
                </div>
              </div>
            </a>
          `;
        }).join("");
      }
      }

      window.addEventListener("discover-romania-articles-updated", renderArticles);
      renderArticles();

      const ugcCountyBtn = document.getElementById("btn-ugc-county");
      if (ugcCountyBtn) {
        ugcCountyBtn.onclick = () => window.openUgcModal(slug);
      }

      if (typeof gtag === "function") {
        gtag("event", "view_county", {
          county: slug,
          county_name: county.name,
          sector: county.sector
        });
      }
    })();
  </script>
</body>
</html>
