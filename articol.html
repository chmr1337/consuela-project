<!DOCTYPE html>
<html lang="ro">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLXPD4ND09"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BLXPD4ND09');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articol Turistic — Drumuri bune</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <div id="site-header"></div>

  <main class="flex-1 mx-auto w-full max-w-3xl px-6 py-10">
    <div id="article-content-container">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/romania-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      renderSiteHeader("harta");
      renderSiteFooter();

      const countySlug = getParam("judet") || "cluj";
      const articleSlug = getParam("slug") || "locuri-de-vizitat";
      const container = document.getElementById("article-content-container");

      function render() {
        const cObj = AppStore.getCountyObj(countySlug);
        const countyName = cObj ? cObj.name : countySlug;
        const sec = AppStore.getSectorByCounty(countySlug);
        const sectorName = sec ? sec.name : "România";

        const article = AppStore.findArticle(countySlug, articleSlug);

        if (!article) {
          container.innerHTML = `
            <div class="py-16 text-center">
              <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[var(--secondary)] text-[var(--primary)] text-2xl">
                🧭
              </div>
              <h1 class="mt-4 text-2xl font-bold tracking-tight text-[var(--foreground)] sm:text-3xl">
                Acest articol nu a fost scris încă
              </h1>
              <p class="mt-2 text-sm text-[var(--muted-foreground)]">
                Nu există încă un text publicat pentru «${articleSlug}» în județul ${countyName}. Revino în curând!
              </p>
              <div class="mt-6 flex flex-wrap justify-center gap-3">
                <a href="judet.html?judet=${countySlug}" class="inline-flex items-center gap-2 rounded-md border border-[var(--input)] bg-white px-4 py-2 text-sm font-semibold hover:bg-[var(--secondary)]">
                  <span>← Înapoi la ${countyName}</span>
                </a>
              </div>
            </div>
          `;
          return;
        }

        document.title = `${article.title} — ${countyName} | Drumuri bune`;

        const tObj = window.ARTICLE_TOPICS.find(t => t.slug === article.slug);
        const topicLabel = article.topicLabel || (tObj ? tObj.label : "Articol Turistic");

        // Others
        const others = AppStore.getCountyArticles(countySlug).filter(a => a.slug !== articleSlug);

        container.innerHTML = `
          <!-- Breadcrumb -->
          <nav class="flex flex-wrap items-center gap-2 text-xs font-medium text-[var(--muted-foreground)]">
            <a href="index.html" class="hover:text-[var(--primary)]">Harta</a>
            <span>/</span>
            <a href="sectoare.html" class="hover:text-[var(--primary)]">${sectorName}</a>
            <span>/</span>
            <a href="judet.html?judet=${countySlug}" class="hover:text-[var(--primary)]">${countyName}</a>
            <span>/</span>
            <span class="font-semibold text-[var(--foreground)]">${topicLabel}</span>
          </nav>

          <!-- Cover Image -->
          ${article.imageUrl ? `
            <div class="mt-6 overflow-hidden rounded-2xl border border-[var(--border)] shadow-md">
              <img src="${article.imageUrl}" alt="${article.title}" class="h-64 w-full object-cover sm:h-80">
            </div>
          ` : ""}

          <!-- Article Header -->
          <div class="mt-6">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="rounded-md bg-[var(--secondary)] px-2.5 py-1 text-xs font-bold uppercase tracking-wider text-[var(--accent)]">
                ${topicLabel} · Sector ${sectorName} · ${countyName}
              </span>
            </div>

            <h1 class="mt-3 text-3xl font-bold tracking-tight text-[var(--foreground)] sm:text-4xl">
              ${article.title}
            </h1>
            <p class="mt-3 text-lg leading-relaxed text-[var(--muted-foreground)]">
              ${article.excerpt}
            </p>
            <div class="mt-3 flex items-center gap-4 text-xs font-medium text-[var(--muted-foreground)]">
              <span>🕒 Lectură de ~${article.readMinutes} minute</span>
              ${article.isCustom ? `<span class="rounded-full bg-emerald-100 text-emerald-800 px-2 py-0.5 font-bold">Articol creat de utilizator</span>` : ""}
            </div>
          </div>

          <!-- Sections -->
          <div class="mt-10 space-y-8">
            ${article.sections.map(sec => `
              <section class="rounded-xl border border-[var(--border)]/70 bg-white p-6 shadow-xs">
                <h2 class="text-xl font-bold text-[var(--foreground)] sm:text-2xl">${sec.heading}</h2>
                <p class="mt-3 text-base leading-relaxed text-[var(--foreground)]/90 whitespace-pre-line">${sec.body}</p>
              </section>
            `).join("")}
          </div>

          <!-- Tips -->
          ${article.tips && article.tips.length > 0 ? `
            <aside class="mt-10 rounded-xl border border-[var(--border)] bg-[var(--secondary)]/70 p-6 shadow-xs">
              <h3 class="text-lg font-bold text-[var(--foreground)] flex items-center gap-2">
                <span>💡</span>
                <span>Sfaturi utile și recomandări practice</span>
              </h3>
              <ul class="mt-4 space-y-2">
                ${article.tips.map(t => `
                  <li class="flex items-start gap-2.5 text-sm leading-relaxed text-[var(--foreground)]">
                    <span class="mt-1.5 h-2 w-2 rounded-full bg-[var(--primary)] shrink-0"></span>
                    <span>${t}</span>
                  </li>
                `).join("")}
              </ul>
            </aside>
          ` : ""}

          <!-- Footer Navigation -->
          <div class="mt-12 border-t border-[var(--border)] pt-6">
            <h4 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Continuă explorarea</h4>
            <div class="mt-3 flex flex-wrap gap-2.5">
              <a href="judet.html?judet=${countySlug}" class="rounded-md bg-[var(--primary)] px-4 py-2 text-xs font-semibold text-white shadow-xs hover:bg-[var(--primary-hover)]">
                Toate articolele despre ${countyName}
              </a>
              ${others.map(o => `
                <a href="articol.html?judet=${countySlug}&slug=${o.slug}" class="rounded-md border border-[var(--input)] bg-white px-3.5 py-2 text-xs font-semibold hover:bg-[var(--secondary)]">
                  ${o.title}
                </a>
              `).join("")}
            </div>
          </div>
        `;

        if (typeof gtag === "function") {
          gtag("event", "view_article", {
            county: countySlug,
            county_name: countyName,
            article_slug: articleSlug,
            article_title: article.title
          });
        }
      }

      window.addEventListener("discover-romania-articles-updated", render);
      render();
    })();
  </script>
</body>
</html>
