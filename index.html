<!DOCTYPE html>
<html lang="ro">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLXPD4ND09"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drumuri bune — Harta turismului pe sectoare și județe</title>
  <meta name="description" content="Atinge un județ pe harta României și citește articole despre locurile de vizitat, mâncare, tradiții și trasee montane din fiecare sector al țării.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <div id="site-header"></div>

  <!-- Main Explorer Layout -->
  <div class="flex-1 mx-auto w-full max-w-6xl p-3 sm:p-6">
    <div class="flex flex-col lg:grid lg:grid-cols-[290px_1fr] gap-4 sm:gap-6 items-start">

      <!-- 1. Harta României: FIRST ON MOBILE (order-1), top of right column on desktop (lg:col-start-2 lg:row-start-2) -->
      <div id="map-wrapper" class="order-1 lg:order-none lg:col-start-2 lg:row-start-2 w-full relative overflow-hidden rounded-xl border border-[var(--border)] bg-[var(--card)] p-2.5 sm:p-4 shadow-xs">
        <svg id="romania-svg-map" class="h-auto w-full select-none" role="img" aria-label="Harta României">
          <!-- Rendered dynamically -->
        </svg>

        <!-- Map Hint -->
        <div id="map-hint" class="map-hint pointer-events-none absolute bottom-2.5 sm:bottom-4 left-1/2 flex w-max max-w-[92%] text-center -translate-x-1/2 items-center gap-2 rounded-full border border-[var(--border)] bg-[var(--card)]/95 px-3 py-1 sm:px-3.5 sm:py-1.5 text-[11px] sm:text-xs font-medium text-[var(--muted-foreground)] shadow-md">
          <svg class="map-hint-icon h-3.5 w-3.5 sm:h-4 sm:w-4 text-[var(--primary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
          <span class="hidden sm:inline">Treci cu mouse-ul peste hartă sau atinge un județ pentru detalii</span>
          <span class="sm:hidden">Atinge un județ de pe hartă pentru detalii</span>
        </div>

        <!-- Hover Tooltip -->
        <div id="map-tooltip" class="pointer-events-none absolute left-6 top-6 hidden items-center gap-2 rounded-lg border border-[var(--border)] bg-[var(--foreground)] px-3.5 py-1.5 text-sm font-semibold text-white shadow-lg">
          <span id="tooltip-name"></span>
          <span id="tooltip-sector" class="text-xs font-normal text-white/80"></span>
        </div>
      </div>

      <!-- 2. Sector Navigation Filter Bar: Second on mobile (order-2), top bar on desktop (lg:col-span-2 lg:row-start-1) -->
      <section id="sector-filter-section" class="order-2 lg:order-none lg:col-span-2 lg:row-start-1 w-full rounded-xl border border-[var(--border)] bg-gradient-to-r from-[var(--secondary)]/60 via-[var(--background)] to-[var(--secondary)]/60 px-3 sm:px-4 py-2 sm:py-2.5 shadow-xs">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 shrink-0">
            <svg class="h-3.5 w-3.5 text-[var(--primary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v20m10-10H2m18.07-7.07l-1.41 1.41M5.34 18.66l-1.41 1.41M18.66 18.66l-1.41-1.41M5.34 5.34l-1.41 1.41"/></svg>
            <span class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Sectoare:</span>
          </div>
          <div id="sector-filters" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 lg:flex-wrap">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </section>

      <!-- 3. Lista de județe: Third on mobile (order-3), left column on desktop (lg:col-start-1 lg:row-start-2 lg:row-span-2) -->
      <aside id="county-list-aside" class="order-3 lg:order-none lg:col-start-1 lg:row-start-2 lg:row-span-2 lg:sticky lg:top-20 flex flex-col w-full rounded-xl border border-[var(--border)] bg-[var(--card)] p-3 sm:p-4 shadow-xs">
        <div class="flex items-center justify-between pb-2 border-b border-[var(--border)]/60">
          <div class="flex items-center gap-1.5">
            <h2 id="county-list-title" class="text-sm sm:text-base font-bold text-[var(--foreground)]">Județe (42)</h2>
            <span class="text-[10px] text-[var(--muted-foreground)] bg-[var(--secondary)] px-1.5 py-0.5 rounded font-medium">derulează (5 pe ecran)</span>
          </div>
          <a href="sectoare.html" class="text-xs text-[var(--primary)] font-semibold underline-offset-2 hover:underline">Sectoare →</a>
        </div>

        <div class="my-2">
          <input
            id="county-search"
            type="text"
            placeholder="Caută un județ…"
            class="w-full rounded-md border border-[var(--input)] bg-[var(--background)] px-2.5 py-1.5 text-xs sm:text-sm outline-none focus:border-[var(--ring)] transition-colors"
          />
        </div>

        <!-- Scrollable container: EXACTLY 5 items visible on mobile, scrollable -->
        <div class="relative overflow-hidden rounded-md">
          <ul id="county-list" class="max-h-[206px] lg:max-h-[calc(100vh-240px)] space-y-1 overflow-y-auto overscroll-contain pr-1">
            <!-- Rendered dynamically -->
          </ul>
        </div>
      </aside>

      <!-- 4. Detalii județ selectat: Fourth on mobile (order-4), right column row 3 on desktop (lg:col-start-2 lg:row-start-3) -->
      <section id="selected-county-card" class="order-4 lg:order-none lg:col-start-2 lg:row-start-3 w-full rounded-xl border border-[var(--border)] bg-[var(--card)] p-4 sm:p-6 shadow-xs">
        <!-- Rendered dynamically -->
      </section>

    </div>

    <!-- 4. Articole recomandate (Selecție aleatorie din site) -->
    <section id="recommended-section" class="mt-10 sm:mt-12 border-t border-[var(--border)] pt-8">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg">✨</span>
            <h2 class="font-display text-xl sm:text-2xl font-bold text-[var(--foreground)]">Articole recomandate</h2>
          </div>
          <p class="mt-1 text-xs sm:text-sm text-[var(--muted-foreground)]">Locuri de vizitat, tradiții gastronomice și trasee din România alese aleatoriu pentru tine.</p>
        </div>
        <button
          id="shuffle-recommended-btn"
          type="button"
          class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] px-3 py-1.5 text-xs font-semibold text-[var(--foreground)] transition-colors hover:bg-[var(--secondary)]/70 hover:text-[var(--primary)] active:scale-95 cursor-pointer"
          title="Schimbă selecția de articole recomandate"
        >
          <svg class="h-3.5 w-3.5 text-[var(--primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Alte recomandări</span>
        </button>
      </div>

      <div id="recommended-articles-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </div>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/romania-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      renderSiteHeader("harta");
      renderSiteFooter();

      let activeSector = "all";
      let activeCounty = getParam("county") || null;
      let hoveredCounty = null;
      let searchQuery = "";

      const sectorContainer = document.getElementById("sector-filters");
      const countyList = document.getElementById("county-list");
      const countySearch = document.getElementById("county-search");
      const mapSvg = document.getElementById("romania-svg-map");
      const tooltip = document.getElementById("map-tooltip");
      const mapHint = document.getElementById("map-hint");
      const tooltipName = document.getElementById("tooltip-name");
      const tooltipSector = document.getElementById("tooltip-sector");
      const cardContainer = document.getElementById("selected-county-card");
      const listTitle = document.getElementById("county-list-title");

      // 1. Render Sector Filter Buttons
      function renderSectors() {
        sectorContainer.innerHTML = `
          <button data-sector="all" class="sector-btn shrink-0 rounded-md px-2.5 py-1 text-xs font-semibold transition-colors ${
            activeSector === "all" ? "bg-[var(--primary)] text-white shadow-xs" : "bg-[var(--secondary)] text-[var(--foreground)] hover:bg-[var(--secondary)]/80"
          }">Toată țara</button>
        ` + window.ROMANIA_SECTORS.map(s => `
          <button data-sector="${s.id}" class="sector-btn shrink-0 rounded-md px-2.5 py-1 text-xs font-semibold transition-colors ${
            activeSector === s.id ? "bg-[var(--primary)] text-white shadow-xs" : "bg-[var(--secondary)] text-[var(--muted-foreground)] hover:bg-[var(--secondary)]/80 hover:text-[var(--foreground)]"
          }">${s.name}</button>
        `).join("");

        document.querySelectorAll(".sector-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            activeSector = btn.getAttribute("data-sector");
            renderSectors();
            renderCountyList();
            updateMapHighlights();
          });
        });
      }

      // 2. Render Map
      function renderMap() {
        mapSvg.setAttribute("viewBox", window.MAP_VIEWBOX);
        mapSvg.innerHTML = window.ROMANIA_COUNTIES.map(c => `
          <path
            id="path-${c.slug}"
            data-slug="${c.slug}"
            data-name="${c.name}"
            d="${c.d}"
            class="county-path"
            tabindex="0"
          ><title>${c.name}</title></path>
        `).join("");

        mapSvg.querySelectorAll(".county-path").forEach(path => {
          const slug = path.getAttribute("data-slug");
          const name = path.getAttribute("data-name");

          path.addEventListener("mouseenter", () => {
            hoveredCounty = slug;
            mapHint.classList.add("is-hidden");
            const sec = AppStore.getSectorByCounty(slug);
            tooltipName.textContent = name;
            tooltipSector.textContent = sec ? ` · Sector ${sec.name}` : "";
            tooltip.classList.remove("hidden");
            tooltip.classList.add("flex");
            updateMapHighlights();
          });

          path.addEventListener("mouseleave", () => {
            hoveredCounty = null;
            mapHint.classList.remove("is-hidden");
            tooltip.classList.add("hidden");
            tooltip.classList.remove("flex");
            updateMapHighlights();
          });

          path.addEventListener("click", () => {
            selectCounty(slug, true);
          });
        });

        updateMapHighlights();
      }

      function updateMapHighlights() {
        document.querySelectorAll(".county-path").forEach(path => {
          const slug = path.getAttribute("data-slug");
          const sec = AppStore.getSectorByCounty(slug);
          const inSector = activeSector === "all" || (sec && sec.id === activeSector);
          const isSelected = slug === activeCounty;
          const isHovered = slug === hoveredCounty;

          path.setAttribute("data-active", isSelected || isHovered ? "true" : "false");
          path.style.opacity = inSector ? "1" : "0.35";
          path.style.filter = inSector ? "" : "grayscale(50%)";
        });
      }

      // 3. Render County List (Compact & Scrollable)
      function renderCountyList() {
        const withArticles = AppStore.countiesWithArticles();
        const filtered = window.ROMANIA_COUNTIES.filter(c => {
          if (activeSector !== "all") {
            const sec = AppStore.getSectorByCounty(c.slug);
            if (!sec || sec.id !== activeSector) return false;
          }
          if (searchQuery.trim()) {
            return c.name.toLowerCase().includes(searchQuery.toLowerCase());
          }
          return true;
        });

        const activeSecObj = window.ROMANIA_SECTORS.find(s => s.id === activeSector);
        listTitle.textContent = activeSector === "all" ? `Județe (${filtered.length})` : `${activeSecObj.name} (${filtered.length})`;

        countyList.innerHTML = filtered.map(c => {
          const isSelected = c.slug === activeCounty;
          const hasArt = withArticles.includes(c.slug);

          return `
            <li>
              <button
                data-slug="${c.slug}"
                class="county-item-btn flex w-full h-[38px] items-center justify-between rounded-md px-2.5 text-left text-xs sm:text-sm transition-colors cursor-pointer ${
                  isSelected ? "bg-[var(--primary)] font-semibold text-white shadow-xs" : "text-[var(--foreground)] hover:bg-[var(--secondary)]"
                }"
              >
                <span class="truncate font-medium">${c.name}</span>
                ${hasArt ? `<span class="ml-1 shrink-0 text-[10px] font-bold ${isSelected ? "text-white/90" : "text-emerald-700"}">● Articole</span>` : ""}
              </button>
            </li>
          `;
        }).join("");

        countyList.querySelectorAll(".county-item-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            selectCounty(btn.getAttribute("data-slug"), true);
          });
        });
      }

      // 4. Select a County & Render Card
      function selectCounty(slug, shouldScroll = false) {
        activeCounty = slug;
        renderCountyList();
        updateMapHighlights();
        renderCard();

        // Auto-scroll selected item into view inside the scrollable county list
        const activeBtn = countyList.querySelector(`[data-slug="${slug}"]`);
        if (activeBtn) {
          activeBtn.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        if (typeof gtag === "function") {
          const sec = AppStore.getSectorByCounty(slug);
          gtag("event", "select_county", {
            county: slug,
            sector: sec ? sec.name : "România"
          });
        }

        // Update URL cleanly without reloading
        const url = new URL(window.location);
        url.searchParams.set("county", slug);
        window.history.replaceState({}, "", url);

        if (shouldScroll && window.innerWidth < 1024) {
          setTimeout(() => {
            cardContainer.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 60);
        }
      }

      function renderCard() {
        if (!activeCounty) {
          cardContainer.innerHTML = `
            <div class="py-8 text-center">
              <svg class="mx-auto h-10 w-10 text-[var(--primary)]/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
              <h3 class="mt-2 text-lg font-bold text-[var(--foreground)]">Alege un județ de pe hartă sau din listă</h3>
              <p class="mx-auto mt-1 max-w-md text-sm text-[var(--muted-foreground)]">Atinge un județ pentru a citi recomandările de vizitat, gastronomia și traseele de drumeție.</p>
              <div class="mt-4 flex flex-wrap justify-center gap-2">
                <a href="sectoare.html" class="inline-flex items-center gap-1.5 rounded-md border border-[var(--input)] bg-[var(--secondary)] px-4 py-2 text-xs font-semibold hover:bg-[var(--secondary)]/80">Vezi Sectoarele României</a>
              </div>
            </div>
          `;
          return;
        }

        const countyObj = AppStore.getCountyObj(activeCounty);
        const countyName = countyObj ? countyObj.name : activeCounty;
        const note = window.COUNTY_NOTES ? window.COUNTY_NOTES[activeCounty] : null;
        const sec = AppStore.getSectorByCounty(activeCounty);
        const articles = AppStore.getCountyArticles(activeCounty);

        cardContainer.innerHTML = `
          <div class="flex flex-wrap items-baseline justify-between gap-3 border-b border-[var(--border)] pb-4">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-3xl font-bold text-[var(--primary)]">${countyName}</h2>
                ${sec ? `<span class="rounded-md bg-[var(--secondary)] px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider text-[var(--accent)]">Sector ${sec.name}</span>` : ""}
              </div>
              ${note && note.intro ? `<p class="mt-2 text-base text-[var(--muted-foreground)]">${note.intro}</p>` : ""}
            </div>

            <div class="flex items-center gap-2">
              <a href="judet.html?judet=${activeCounty}" class="inline-flex items-center gap-1 text-sm font-semibold text-[var(--primary)] hover:underline">
                <span>Pagina județului →</span>
              </a>
            </div>
          </div>

          <div class="mt-6">
            <h3 class="text-lg font-bold text-[var(--foreground)] mb-4">Articole turistice despre ${countyName} (${articles.length})</h3>

            <div class="grid gap-4 sm:grid-cols-3">
              ${window.ARTICLE_TOPICS.map(topic => {
                const art = articles.find(a => a.slug === topic.slug);
                if (!art) {
                  return `
                    <div class="flex flex-col justify-between rounded-lg border border-dashed border-[var(--border)] bg-[var(--secondary)]/40 p-4">
                      <div>
                        <span class="text-xs font-bold uppercase tracking-wide text-[var(--accent)]">${topic.label}</span>
                        <p class="mt-1 text-xs text-[var(--muted-foreground)]">${topic.blurb}</p>
                      </div>
                      <p class="mt-4 pt-2 text-xs italic text-[var(--muted-foreground)]">În curând</p>
                    </div>
                  `;
                }

                return `
                  <a href="articol.html?judet=${activeCounty}&slug=${art.slug}" class="flex flex-col justify-between rounded-lg border border-[var(--border)] bg-[var(--card)] p-4 shadow-xs transition-all hover:border-[var(--primary)] hover:shadow-md text-decoration-none">
                    <div>
                      <span class="text-xs font-bold uppercase tracking-wide text-[var(--accent)]">${topic.label}</span>
                      <h4 class="mt-1 text-base font-bold text-[var(--foreground)] line-clamp-2">${art.title}</h4>
                      <p class="mt-1 text-xs text-[var(--muted-foreground)] line-clamp-2">${art.excerpt}</p>
                    </div>
                    <span class="mt-3 block text-xs font-medium text-[var(--primary)]">Citește · ${art.readMinutes} min</span>
                  </a>
                `;
              }).join("")}

              ${articles.filter(a => !window.ARTICLE_TOPICS.some(t => t.slug === a.slug)).map(cArt => `
                <a href="articol.html?judet=${activeCounty}&slug=${cArt.slug}" class="flex flex-col justify-between rounded-lg border border-emerald-500/30 bg-emerald-500/5 p-4 shadow-xs transition-all hover:border-emerald-500 text-decoration-none">
                  <div>
                    <span class="rounded-sm bg-emerald-500/20 px-1.5 py-0.5 text-[10px] font-bold uppercase text-emerald-800">${cArt.topicLabel || "Special"}</span>
                    <h4 class="mt-1 text-base font-bold text-[var(--foreground)] line-clamp-2">${cArt.title}</h4>
                    <p class="mt-1 text-xs text-[var(--muted-foreground)] line-clamp-2">${cArt.excerpt}</p>
                  </div>
                  <span class="mt-3 block text-xs font-medium text-emerald-700">Citește · ${cArt.readMinutes} min</span>
                </a>
              `).join("")}
            </div>
          </div>
        `;
      }

      // 5. Render Recommended Random Articles
      function renderRecommendedArticles() {
        const grid = document.getElementById("recommended-articles-grid");
        if (!grid) return;

        const all = AppStore.getAllArticles();
        if (!all || all.length === 0) {
          grid.innerHTML = `<p class="col-span-full py-6 text-center text-sm text-[var(--muted-foreground)]">Nu există articole disponibile încă.</p>`;
          return;
        }

        // Shuffle with Fisher-Yates and pick 6
        const shuffled = [...all];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const selected = shuffled.slice(0, 6);

        grid.innerHTML = selected.map(({ countySlug, article }) => {
          const countyObj = AppStore.getCountyObj(countySlug);
          const countyName = countyObj ? countyObj.name : countySlug;
          const sec = AppStore.getSectorByCounty(countySlug);
          const sectorName = sec ? sec.name : "";
          const topic = window.ARTICLE_TOPICS ? window.ARTICLE_TOPICS.find(t => t.slug === article.slug) : null;
          const topicLabel = article.topicLabel || (topic ? topic.label : "Ghid Turistic");
          const imgUrl = article.imageUrl || "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=800&auto=format&fit=crop";

          return `
            <a href="articol.html?judet=${countySlug}&slug=${article.slug}" class="recommended-card group flex flex-col justify-between overflow-hidden rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-xs transition-all duration-200 hover:-translate-y-1 hover:border-[var(--primary)] hover:shadow-md text-decoration-none">
              <div>
                <div class="relative h-44 w-full overflow-hidden bg-[var(--secondary)]">
                  <img
                    src="${imgUrl}"
                    alt="${article.title}"
                    class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
                    loading="lazy"
                    onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=800&auto=format&fit=crop';"
                  />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 flex flex-wrap gap-1.5">
                    <span class="rounded-md bg-black/70 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">
                      ${countyName}
                    </span>
                    ${sectorName ? `
                      <span class="rounded-md bg-[var(--primary)]/90 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">
                        ${sectorName}
                      </span>
                    ` : ""}
                  </div>
                  <span class="absolute bottom-2.5 left-2.5 rounded bg-white/95 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-[var(--accent)]">
                    ${topicLabel}
                  </span>
                </div>

                <div class="p-4">
                  <h3 class="font-bold text-base text-[var(--foreground)] group-hover:text-[var(--primary)] transition-colors line-clamp-2">
                    ${article.title}
                  </h3>
                  <p class="mt-2 text-xs leading-relaxed text-[var(--muted-foreground)] line-clamp-2">
                    ${article.excerpt}
                  </p>
                </div>
              </div>

              <div class="flex items-center justify-between border-t border-[var(--border)] px-4 py-3 text-xs font-semibold text-[var(--primary)]">
                <span class="text-[var(--muted-foreground)] font-medium">🕒 ${article.readMinutes} min lectură</span>
                <span class="inline-flex items-center gap-1 group-hover:translate-x-1 transition-transform">Citește articolul →</span>
              </div>
            </a>
          `;
        }).join("");
      }

      const shuffleBtn = document.getElementById("shuffle-recommended-btn");
      if (shuffleBtn) {
        shuffleBtn.addEventListener("click", () => {
          renderRecommendedArticles();
          if (typeof gtag === "function") {
            gtag("event", "shuffle_recommended_articles");
          }
        });
      }

      countySearch.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderCountyList();
      });

      window.addEventListener("discover-romania-articles-updated", () => {
        renderCountyList();
        renderCard();
        renderRecommendedArticles();
      });

      renderSectors();
      renderMap();
      renderCountyList();
      renderCard();
      renderRecommendedArticles();
    })();
  </script>
</body>
</html>
