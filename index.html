<html lang="ro">

  <title>Drumuri bune — Harta turismului pe sectoare și județe</title>
  <meta name="description" content="Atinge un județ pe harta României și citește articole despre locurile de vizitat, mâncare, tradiții și trasee montane din fiecare sector al țării.">

<body class="min-h-screen flex flex-col justify-between">
  <div id="site-header"></div>

  <!-- Main Explorer Layout -->
  <div class="flex-1 mx-auto w-full max-w-6xl p-3 sm:p-6">
    <div class="flex flex-col lg:grid lg:grid-cols-[290px_1fr] gap-4 sm:gap-6 items-start">

      <!-- 1. Harta României: FIRST ON MOBILE (order-1), top of right column on desktop (lg:col-start-2 lg:row-start-2) -->
      <div id="map-wrapper" class="order-1 lg:order-none lg:col-start-2 lg:row-start-2 w-full relative overflow-hidden rounded-xl border border-[var(--border)] bg-[var(--card)] p-2.5 sm:p-4 shadow-xs">
        <svg id="romania-svg-map" class="h-auto w-full select-none" role="img" aria-label="Harta României">
          <!-- Rendered dynamically -->
        </svg>

        <!-- Map Hint & Legend -->
        <div id="map-hint" class="map-hint pointer-events-none absolute bottom-2.5 sm:bottom-4 left-1/2 flex w-max max-w-[94%] text-center -translate-x-1/2 flex-wrap justify-center items-center gap-1.5 sm:gap-2 rounded-full border border-[var(--border)] bg-[var(--card)]/95 px-3 py-1 sm:px-3.5 sm:py-1.5 text-[11px] sm:text-xs font-medium text-[var(--muted-foreground)] shadow-md">
          <svg class="map-hint-icon h-3.5 w-3.5 sm:h-4 sm:w-4 text-[var(--primary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
          <span class="hidden sm:inline">Atinge un județ pentru detalii</span>
          <span class="sm:hidden">Atinge un județ de pe hartă</span>
          <span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full">
            <span class="h-2 w-2 rounded-full bg-[#2f7a4d]"></span>
            <span>Județe cu articole</span>
          </span>
        </div>

        <!-- Hover Tooltip -->
        <div id="map-tooltip" class="pointer-events-none absolute left-6 top-6 hidden items-center gap-2 rounded-lg border border-[var(--border)] bg-[var(--foreground)] px-3.5 py-1.5 text-sm font-semibold text-white shadow-lg">
          <span id="tooltip-name"></span>
          <span id="tooltip-sector" class="text-xs font-normal text-white/80"></span>
        </div>
      </div>

      <!-- 2. Articole & Detalii județ selectat: Second on mobile (order-2) - directly under the map! Right column row 3 on desktop (lg:col-start-2 lg:row-start-3) -->
      <section id="selected-county-card" class="order-2 lg:order-none lg:col-start-2 lg:row-start-3 w-full rounded-xl border border-[var(--border)] bg-[var(--card)] p-4 sm:p-6 shadow-xs">
        <!-- Rendered dynamically -->
      </section>

      <!-- 3. Sector Navigation Filter Bar: Third on mobile (order-3), top bar on desktop (lg:col-span-2 lg:row-start-1) -->
      <section id="sector-filter-section" class="order-3 lg:order-none lg:col-span-2 lg:row-start-1 w-full rounded-xl border border-[var(--border)] bg-gradient-to-r from-[var(--secondary)]/60 via-[var(--background)] to-[var(--secondary)]/60 px-3 sm:px-4 py-2 sm:py-2.5 shadow-xs">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 shrink-0">
            <svg class="h-3.5 w-3.5 text-[var(--primary)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v20m10-10H2m18.07-7.07l-1.41 1.41M5.34 18.66l-1.41 1.41M18.66 18.66l-1.41-1.41M5.34 5.34l-1.41 1.41"/></svg>
            <span class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Sectoare:</span>
          </div>
          <div id="sector-filters" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 lg:flex-wrap">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </section>

      <!-- 4. Lista de județe: Fourth on mobile (order-4), left column on desktop (lg:col-start-1 lg:row-start-2 lg:row-span-2) -->
      <aside id="county-list-aside" class="order-4 lg:order-none lg:col-start-1 lg:row-start-2 lg:row-span-2 lg:sticky lg:top-20 flex flex-col w-full rounded-xl border border-[var(--border)] bg-[var(--card)] p-3 sm:p-4 shadow-xs">
        <div class="flex items-center justify-between pb-2 border-b border-[var(--border)]/60">
          <div class="flex items-center gap-1.5">
            <h2 id="county-list-title" class="text-sm sm:text-base font-bold text-[var(--foreground)]">Județe (42)</h2>
            <span id="county-list-hint" class="text-[10px] sm:text-xs text-[var(--muted-foreground)] bg-[var(--secondary)] px-2 py-0.5 rounded-full font-medium">↕ 5 afișate · derulează</span>
          </div>
          <a href="sectoare.html" class="text-xs text-[var(--primary)] font-semibold underline-offset-2 hover:underline">Sectoare →</a>
        </div>

        <div class="my-2">
          <input
            id="county-search"
            type="text"
            placeholder="Caută un județ…"
            class="w-full rounded-md border border-[var(--input)] bg-[var(--background)] px-2.5 py-1.5 text-xs sm:text-sm outline-none focus:border-[var(--ring)] transition-colors"
          />
        </div>

        <!-- Scrollable container: EXACTLY 5 items visible on mobile, scrollable -->
        <div class="relative rounded-lg border border-[var(--border)]/70 bg-[var(--secondary)]/15 p-1">
          <ul id="county-list" class="h-[206px] lg:h-auto lg:max-h-[calc(100vh-250px)] space-y-1 overflow-y-auto overscroll-contain pr-1">
            <!-- Rendered dynamically -->
          </ul>
        </div>
      </aside>

    </div>

    <!-- 4. Articole recomandate (Selecție aleatorie din site) -->
    <section id="recommended-section" class="mt-10 sm:mt-12 border-t border-[var(--border)] pt-8">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg">✨</span>
            <h2 class="font-display text-xl sm:text-2xl font-bold text-[var(--foreground)]">Articole recomandate</h2>
          </div>
          <p class="mt-1 text-xs sm:text-sm text-[var(--muted-foreground)]">Locuri de vizitat, tradiții gastronomice și trasee din România alese aleatoriu pentru tine.</p>
        </div>
        <button
          id="shuffle-recommended-btn"
          type="button"
          class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] px-3 py-1.5 text-xs font-semibold text-[var(--foreground)] transition-colors hover:bg-[var(--secondary)]/70 hover:text-[var(--primary)] active:scale-95 cursor-pointer"
          title="Schimbă selecția de articole recomandate"
        >
          <svg class="h-3.5 w-3.5 text-[var(--primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Alte recomandări</span>
        </button>
      </div>

      <div id="recommended-articles-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </div>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/romania-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      renderSiteHeader("harta");
      renderSiteFooter();

      let activeSector = "all";
      let activeCounty = getParam("county") || null;
      let hoveredCounty = null;
      let searchQuery = "";

      const sectorContainer = document.getElementById("sector-filters");
      const countyList = document.getElementById("county-list");
      const countySearch = document.getElementById("county-search");
      const mapSvg = document.getElementById("romania-svg-map");
      const tooltip = document.getElementById("map-tooltip");
      const mapHint = document.getElementById("map-hint");
      const tooltipName = document.getElementById("tooltip-name");
      const tooltipSector = document.getElementById("tooltip-sector");
      const cardContainer = document.getElementById("selected-county-card");
      const listTitle = document.getElementById("county-list-title");

      // 1. Render Sector Filter Buttons
      function renderSectors() {
        sectorContainer.innerHTML = `
          <button data-sector="all" class="sector-btn shrink-0 rounded-md px-2.5 py-1 text-xs font-semibold transition-colors ${
            activeSector === "all" ? "bg-[var(--primary)] text-white shadow-xs" : "bg-[var(--secondary)] text-[var(--foreground)] hover:bg-[var(--secondary)]/80"
          }">Toată țara</button>
        ` + window.ROMANIA_SECTORS.map(s => `
          <button data-sector="${s.id}" class="sector-btn shrink-0 rounded-md px-2.5 py-1 text-xs font-semibold transition-colors ${
            activeSector === s.id ? "bg-[var(--primary)] text-white shadow-xs" : "bg-[var(--secondary)] text-[var(--muted-foreground)] hover:bg-[var(--secondary)]/80 hover:text-[var(--foreground)]"
          }">${s.name}</button>
        `).join("");

        document.querySelectorAll(".sector-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            activeSector = btn.getAttribute("data-sector");
            renderSectors();
            renderCountyList();
            updateMapHighlights();
          });
        });
      }

      // 2. Render Map
      function renderMap() {
        mapSvg.setAttribute("viewBox", window.MAP_VIEWBOX);
        mapSvg.innerHTML = window.ROMANIA_COUNTIES.map(c => `
          <path
            id="path-${c.slug}"
            data-slug="${c.slug}"
            data-name="${c.name}"
            d="${c.d}"
            class="county-path"
            tabindex="0"
          ><title>${c.name}</title></path>
        `).join("");

        mapSvg.querySelectorAll(".county-path").forEach(path => {
          const slug = path.getAttribute("data-slug");
          const name = path.getAttribute("data-name");

          path.addEventListener("mouseenter", () => {
            hoveredCounty = slug;
            mapHint.classList.add("is-hidden");
            const sec = AppStore.getSectorByCounty(slug);
            tooltipName.textContent = name;
            tooltipSector.textContent = sec ? ` · Sector ${sec.name}` : "";
            tooltip.classList.remove("hidden");
            tooltip.classList.add("flex");
            updateMapHighlights();
          });

          path.addEventListener("mouseleave", () => {
            hoveredCounty = null;
            mapHint.classList.remove("is-hidden");
            tooltip.classList.add("hidden");
            tooltip.classList.remove("flex");
            updateMapHighlights();
          });

          path.addEventListener("click", () => {
            selectCounty(slug, window.innerWidth < 1024);
          });

          // Touch events for mobile screens
          let touchMoved = false;
          path.addEventListener("touchstart", () => {
            touchMoved = false;
          }, { passive: true });
          path.addEventListener("touchmove", () => {
            touchMoved = true;
          }, { passive: true });
          path.addEventListener("touchend", (e) => {
            if (!touchMoved) {
              e.preventDefault();
              selectCounty(slug, true);
            }
          });
        });

        updateMapHighlights();
      }

      function updateMapHighlights() {
        const withArticles = AppStore.countiesWithArticles();

        document.querySelectorAll(".county-path").forEach(path => {
          const slug = path.getAttribute("data-slug");
          const sec = AppStore.getSectorByCounty(slug);
          const inSector = activeSector === "all" || (sec && sec.id === activeSector);
          const isSelected = slug === activeCounty;
          const isHovered = slug === hoveredCounty;
          const hasArticles = withArticles.includes(slug);

          path.setAttribute("data-active", isSelected || isHovered ? "true" : "false");
          path.setAttribute("data-has-articles", hasArticles ? "true" : "false");

          if (isSelected || isHovered) {
            path.style.fill = "var(--primary)";
          } else if (hasArticles) {
            path.style.fill = "#2f7a4d";
          } else {
            path.style.fill = "";
          }

          path.style.opacity = inSector ? "1" : "0.35";
          path.style.filter = inSector ? "" : "grayscale(50%)";
        });
      }

      // 3. Render County List (Compact & Scrollable, prioritizing counties with articles)
      function renderCountyList() {
        const withArticles = AppStore.countiesWithArticles();
        const allCreated = AppStore.getAllArticles();

        const filtered = window.ROMANIA_COUNTIES.filter(c => {
          if (activeSector !== "all") {
            const sec = AppStore.getSectorByCounty(c.slug);
            if (!sec || sec.id !== activeSector) return false;
          }
          if (searchQuery.trim()) {
            return c.name.toLowerCase().includes(searchQuery.toLowerCase());
          }
          return true;
        });

        // Prioritize counties with articles at the top of the mobile list
        filtered.sort((a, b) => {
          const aHas = withArticles.includes(a.slug);
          const bHas = withArticles.includes(b.slug);
          if (aHas && !bHas) return -1;
          if (!aHas && bHas) return 1;
          return a.name.localeCompare(b.name, "ro");
        });

        const activeSecObj = window.ROMANIA_SECTORS.find(s => s.id === activeSector);
        listTitle.textContent = activeSector === "all" ? `Județe (${filtered.length})` : `${activeSecObj.name} (${filtered.length})`;

        const isAllSelected = !activeCounty || activeCounty === "all";
        const allBtnHtml = (activeSector === "all" && !searchQuery.trim()) ? `
          <li>
            <button
              data-slug="all"
              class="county-item-btn flex w-full h-[38px] items-center justify-between rounded-md px-2.5 text-left text-xs sm:text-sm transition-colors cursor-pointer ${
                isAllSelected
                  ? "bg-[var(--primary)] font-semibold text-white shadow-xs"
                  : "bg-emerald-50/80 border border-emerald-500/40 text-[var(--foreground)] hover:bg-emerald-100"
              }"
            >
              <span class="truncate font-semibold">⭐ Toate articolele create</span>
              <span class="county-art-badge ml-1 shrink-0 text-[10px] font-bold ${
                isAllSelected ? "text-white/90" : "text-emerald-800 bg-emerald-200/80 px-1.5 py-0.5 rounded"
              }">${allCreated.length}</span>
            </button>
          </li>
        ` : "";

        countyList.innerHTML = allBtnHtml + filtered.map(c => {
          const isSelected = c.slug === activeCounty;
          const countyArts = AppStore.getCountyArticles(c.slug);
          const hasArt = countyArts.length > 0;

          return `
            <li>
              <button
                data-slug="${c.slug}"
                data-has-art="${hasArt}"
                class="county-item-btn flex w-full h-[38px] items-center justify-between rounded-md px-2.5 text-left text-xs sm:text-sm transition-colors cursor-pointer ${
                  isSelected ? "bg-[var(--primary)] font-semibold text-white shadow-xs" : (hasArt ? "bg-emerald-50/70 border border-emerald-500/30 text-[var(--foreground)] hover:bg-emerald-100/70" : "text-[var(--foreground)] hover:bg-[var(--secondary)]")
                }"
              >
                <span class="truncate font-medium">${c.name}</span>
                ${hasArt ? `<span class="county-art-badge ml-1 shrink-0 text-[10px] font-bold ${isSelected ? "text-white/90" : "text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded"}">● ${countyArts.length} art</span>` : ""}
              </button>
            </li>
          `;
        }).join("");

        countyList.querySelectorAll(".county-item-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const s = btn.getAttribute("data-slug");
            selectCounty(s === "all" ? null : s, true);
          });
        });

        updateCountyListSelection(activeCounty);
      }

      function updateCountyListSelection(slug) {
        const isAll = !slug || slug === "all";
        countyList.querySelectorAll(".county-item-btn").forEach(btn => {
          const btnSlug = btn.getAttribute("data-slug");
          const isSelected = (btnSlug === "all" && isAll) || (btnSlug === slug);
          const hasArt = btn.getAttribute("data-has-art") === "true";

          btn.className = `county-item-btn flex w-full h-[38px] items-center justify-between rounded-md px-2.5 text-left text-xs sm:text-sm transition-colors cursor-pointer ${
            isSelected
              ? "bg-[var(--primary)] font-semibold text-white shadow-xs"
              : (hasArt ? "bg-emerald-50/70 border border-emerald-500/30 text-[var(--foreground)] hover:bg-emerald-100/70" : (btnSlug === "all" ? "bg-emerald-50/80 border border-emerald-500/40 text-[var(--foreground)] hover:bg-emerald-100" : "text-[var(--foreground)] hover:bg-[var(--secondary)]"))
          }`;

          const badge = btn.querySelector(".county-art-badge");
          if (badge) {
            badge.className = `county-art-badge ml-1 shrink-0 text-[10px] font-bold ${
              isSelected ? "text-white/90" : "text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded"
            }`;
          }
        });

        // Smoothly scroll active item into view inside the list container without moving the browser window
        if (slug && slug !== "all") {
          const activeBtn = countyList.querySelector(`[data-slug="${slug}"]`);
          if (activeBtn) {
            const cTop = countyList.scrollTop;
            const cHeight = countyList.clientHeight;
            const bTop = activeBtn.offsetTop - countyList.offsetTop;
            const bHeight = activeBtn.offsetHeight;
            if (bTop < cTop) {
              countyList.scrollTo({ top: bTop, behavior: "smooth" });
            } else if (bTop + bHeight > cTop + cHeight) {
              countyList.scrollTo({ top: bTop + bHeight - cHeight, behavior: "smooth" });
            }
          }
        }
      }

      // 4. Select a County & Render Card
      function selectCounty(slug, shouldScroll = false) {
        activeCounty = (slug === "all" || !slug) ? null : slug;
        updateCountyListSelection(activeCounty);
        updateMapHighlights();
        renderCard();

        if (typeof gtag === "function") {
          gtag("event", "select_county", {
            county: activeCounty || "toate",
            sector: activeCounty ? (AppStore.getSectorByCounty(activeCounty)?.name || "România") : "România"
          });
        }

        // Update URL cleanly without reloading
        const url = new URL(window.location);
        if (activeCounty) {
          url.searchParams.set("county", activeCounty);
        } else {
          url.searchParams.delete("county");
        }
        window.history.replaceState({}, "", url);

        if (shouldScroll && window.innerWidth < 1024) {
          setTimeout(() => {
            cardContainer.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 60);
        }
      }

      function renderCard() {
        const allCreated = AppStore.getAllArticles();

        if (!activeCounty || activeCounty === "all") {
          if (allCreated.length > 0) {
            cardContainer.innerHTML = `
              <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
                  <div>
                    <span class="rounded-md bg-emerald-100 text-emerald-800 px-2 py-0.5 text-xs font-bold uppercase tracking-wider">Publicate Recent</span>
                    <h3 class="mt-1 text-xl sm:text-2xl font-bold text-[var(--foreground)]">Articole Turistice Create (${allCreated.length})</h3>
                  </div>
                  <button type="button" onclick="window.openUgcModal()" class="inline-flex items-center gap-1 text-xs font-semibold text-[var(--primary)] hover:underline cursor-pointer">
                    + Adaugă articol
                  </button>
                </div>
                <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                  ${allCreated.map(({ countySlug, article }) => {
                    const cObj = AppStore.getCountyObj(countySlug);
                    const cName = cObj ? cObj.name : countySlug;
                    const cardImg = article.imageUrl || (typeof window.getDefaultArticleImage === "function" ? window.getDefaultArticleImage(article.topicSlug || article.slug) : "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop");
                    return `
                      <a href="articol.html?judet=${countySlug}&slug=${article.slug}" class="group flex flex-col justify-between overflow-hidden rounded-xl border border-emerald-500/30 bg-white shadow-xs transition-all hover:border-emerald-500 hover:shadow-md text-decoration-none">
                        <div class="relative h-36 w-full overflow-hidden bg-emerald-50">
                          <img src="${cardImg}" alt="${article.title}" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop';" />
                          <span class="absolute top-2.5 left-2.5 rounded-md bg-black/65 px-2 py-0.5 text-[10px] font-bold uppercase text-white tracking-wider backdrop-blur-xs">📍 ${cName}</span>
                          ${article.topicLabel ? `<span class="absolute bottom-2.5 left-2.5 rounded bg-white/95 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-[var(--accent)]">${article.topicLabel}</span>` : ""}
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                          <div>
                            <h4 class="text-base font-bold text-[var(--foreground)] group-hover:text-emerald-700 transition-colors line-clamp-2">${article.title}</h4>
                            <p class="mt-1.5 text-xs text-[var(--muted-foreground)] line-clamp-2">${article.excerpt}</p>
                          </div>
                          <div class="mt-3 pt-2.5 border-t border-[var(--border)] flex items-center justify-between text-xs text-emerald-700 font-semibold">
                            <span class="text-[var(--muted-foreground)] font-normal">🕒 ${article.readMinutes} min${article.authorName ? ` · ✍️ ${article.authorName}` : ""}</span>
                            <span>Citește articolul →</span>
                          </div>
                        </div>
                      </a>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
            return;
          }

          cardContainer.innerHTML = `
            <div class="py-8 text-center">
              <span class="text-3xl">🧭</span>
              <h3 class="mt-2 text-lg font-bold text-[var(--foreground)]">Alege un județ de pe hartă sau din listă</h3>
              <p class="mx-auto mt-1 max-w-md text-sm text-[var(--muted-foreground)]">Atinge un județ pentru a citi recomandările de vizitat, gastronomia și traseele de drumeție.</p>
              <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button type="button" onclick="window.openUgcModal()" class="inline-flex items-center gap-1.5 rounded-md bg-[var(--primary)] px-4 py-2 text-xs font-semibold text-white shadow-xs hover:bg-[var(--primary-hover)] cursor-pointer">
                  ✍️ Propune primul articol
                </button>
                <a href="sectoare.html" class="inline-flex items-center gap-1.5 rounded-md border border-[var(--input)] bg-[var(--secondary)] px-4 py-2 text-xs font-semibold hover:bg-[var(--secondary)]/80">Vezi Sectoarele României</a>
              </div>
            </div>
          `;
          return;
        }

        const countyObj = AppStore.getCountyObj(activeCounty);
        const countyName = countyObj ? countyObj.name : activeCounty;
        const note = window.COUNTY_NOTES ? window.COUNTY_NOTES[activeCounty] : null;
        const sec = AppStore.getSectorByCounty(activeCounty);
        const articles = AppStore.getCountyArticles(activeCounty);

        cardContainer.innerHTML = `
          <div class="flex flex-wrap items-baseline justify-between gap-3 border-b border-[var(--border)] pb-4">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-2xl sm:text-3xl font-bold text-[var(--primary)]">${countyName}</h2>
                ${sec ? `<span class="rounded-md bg-[var(--secondary)] px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider text-[var(--accent)]">Sector ${sec.name}</span>` : ""}
              </div>
              ${note && note.intro ? `<p class="mt-2 text-sm sm:text-base text-[var(--muted-foreground)]">${note.intro}</p>` : ""}
            </div>

            <div class="flex items-center gap-3">
              ${allCreated.length > 0 ? `
                <button type="button" onclick="selectCounty(null, true)" class="text-xs font-semibold text-[var(--primary)] hover:underline cursor-pointer">
                  ← Toate articolele (${allCreated.length})
                </button>
              ` : ""}
              <a href="judet.html?judet=${activeCounty}" class="inline-flex items-center gap-1 text-xs sm:text-sm font-semibold text-[var(--primary)] hover:underline">
                <span>Pagina județului →</span>
              </a>
            </div>
          </div>

          <div class="mt-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base sm:text-lg font-bold text-[var(--foreground)]">Articole turistice despre ${countyName} (${articles.length})</h3>
              <button type="button" onclick="window.openUgcModal('${activeCounty}')" class="text-xs font-semibold text-[var(--primary)] hover:underline cursor-pointer">
                + Adaugă articol
              </button>
            </div>

            ${articles.length === 0 ? `
              <div class="rounded-xl border border-dashed border-[var(--border)] bg-[var(--secondary)]/30 p-6 text-center">
                <span class="text-2xl">✍️</span>
                <p class="mt-2 text-sm font-semibold text-[var(--foreground)]">Nu există încă articole scrise pentru ${countyName}.</p>
                <p class="mt-1 text-xs text-[var(--muted-foreground)]">Fii primul care propune o recomandare sau un traseu din această zonă!</p>
                <div class="mt-4 flex flex-wrap justify-center gap-2">
                  <button type="button" onclick="window.openUgcModal('${activeCounty}')" class="inline-flex items-center gap-1.5 rounded-lg bg-[var(--primary)] px-4 py-2 text-xs font-semibold text-white shadow-xs hover:bg-[var(--primary-hover)] cursor-pointer">
                    <span>✍️ Propune primul articol pentru ${countyName}</span>
                  </button>
                  ${allCreated.length > 0 ? `
                    <button type="button" onclick="selectCounty(null, true)" class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border)] bg-white px-4 py-2 text-xs font-semibold text-[var(--foreground)] hover:bg-[var(--secondary)] cursor-pointer">
                      <span>Vezi cele ${allCreated.length} articole create →</span>
                    </button>
                  ` : ""}
                </div>
              </div>

              ${allCreated.length > 0 ? `
                <div class="mt-8 border-t border-[var(--border)] pt-5">
                  <div class="flex items-center justify-between mb-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Articole create recent din alte județe:</h4>
                    <button type="button" onclick="selectCounty(null, true)" class="text-xs font-semibold text-[var(--primary)] hover:underline cursor-pointer">Vezi toate →</button>
                  </div>
                  <div class="grid gap-3 sm:grid-cols-2">
                    ${allCreated.slice(0, 4).map(({ countySlug: cS, article: a }) => {
                      const cO = AppStore.getCountyObj(cS);
                      const cN = cO ? cO.name : cS;
                      const cImg = a.imageUrl || (typeof window.getDefaultArticleImage === "function" ? window.getDefaultArticleImage(a.topicSlug || a.slug) : "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=400&auto=format&fit=crop");
                      return `
                        <a href="articol.html?judet=${cS}&slug=${a.slug}" class="flex items-center gap-3 rounded-xl border border-[var(--border)] bg-white p-3 shadow-xs hover:border-[var(--primary)] hover:shadow-sm transition-all text-decoration-none">
                          <img src="${cImg}" alt="${a.title}" class="h-16 w-16 shrink-0 rounded-lg object-cover" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=400&auto=format&fit=crop';" />
                          <div class="flex-1 min-w-0">
                            <span class="text-[10px] font-bold text-[var(--accent)] uppercase tracking-wider">📍 ${cN}</span>
                            <h5 class="text-xs sm:text-sm font-bold text-[var(--foreground)] truncate">${a.title}</h5>
                            <span class="text-[11px] text-[var(--muted-foreground)]">🕒 ${a.readMinutes} min${a.authorName ? ` · ✍️ ${a.authorName}` : ""}</span>
                          </div>
                        </a>
                      `;
                    }).join("")}
                  </div>
                </div>
              ` : ""}
            ` : `
              <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                ${articles.map(art => {
                  const cardImg = art.imageUrl || (typeof window.getDefaultArticleImage === "function" ? window.getDefaultArticleImage(art.topicSlug || art.slug) : "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop");
                  return `
                    <a href="articol.html?judet=${activeCounty}&slug=${art.slug}" class="group flex flex-col justify-between overflow-hidden rounded-xl border border-[var(--border)] bg-white shadow-xs transition-all hover:border-[var(--primary)] hover:shadow-md text-decoration-none">
                      <div class="relative h-36 w-full overflow-hidden bg-[var(--secondary)]">
                        <img src="${cardImg}" alt="${art.title}" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=600&auto=format&fit=crop';" />
                        <span class="absolute top-2.5 left-2.5 rounded bg-black/65 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white backdrop-blur-xs">${art.topicLabel || "Ghid"}</span>
                        ${art.isUgc ? `<span class="absolute top-2.5 right-2.5 rounded bg-amber-500 text-white px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider">UGC</span>` : ""}
                      </div>
                      <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h4 class="text-sm sm:text-base font-bold text-[var(--foreground)] group-hover:text-[var(--primary)] transition-colors line-clamp-2">${art.title}</h4>
                          <p class="mt-1.5 text-xs text-[var(--muted-foreground)] line-clamp-2">${art.excerpt}</p>
                        </div>
                        <div class="mt-3 pt-2.5 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--primary)] font-semibold">
                          <span class="text-[var(--muted-foreground)] font-normal">🕒 ${art.readMinutes} min${art.authorName ? ` · ✍️ ${art.authorName}` : ""}</span>
                          <span>Citește →</span>
                        </div>
                      </div>
                    </a>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        `;
      }

      // 5. Render Recommended Random Articles
      function renderRecommendedArticles() {
        const grid = document.getElementById("recommended-articles-grid");
        if (!grid) return;

        const all = AppStore.getAllArticles();
        if (!all || all.length === 0) {
          grid.innerHTML = `<p class="col-span-full py-6 text-center text-sm text-[var(--muted-foreground)]">Nu există articole disponibile încă.</p>`;
          return;
        }

        // Shuffle with Fisher-Yates and pick 6
        const shuffled = [...all];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const selected = shuffled.slice(0, 6);

        grid.innerHTML = selected.map(({ countySlug, article }) => {
          const countyObj = AppStore.getCountyObj(countySlug);
          const countyName = countyObj ? countyObj.name : countySlug;
          const sec = AppStore.getSectorByCounty(countySlug);
          const sectorName = sec ? sec.name : "";
          const topic = window.ARTICLE_TOPICS ? window.ARTICLE_TOPICS.find(t => t.slug === article.slug) : null;
          const topicLabel = article.topicLabel || (topic ? topic.label : "Ghid Turistic");
          const imgUrl = article.imageUrl || "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=800&auto=format&fit=crop";

          return `
            <a href="articol.html?judet=${countySlug}&slug=${article.slug}" class="recommended-card group flex flex-col justify-between overflow-hidden rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-xs transition-all duration-200 hover:-translate-y-1 hover:border-[var(--primary)] hover:shadow-md text-decoration-none">
              <div>
                <div class="relative h-44 w-full overflow-hidden bg-[var(--secondary)]">
                  <img
                    src="${imgUrl}"
                    alt="${article.title}"
                    class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=800&auto=format&fit=crop';"
                  />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 flex flex-wrap gap-1.5">
                    <span class="rounded-md bg-black/70 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">
                      ${countyName}
                    </span>
                    ${sectorName ? `
                      <span class="rounded-md bg-[var(--primary)]/90 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-white">
                        ${sectorName}
                      </span>
                    ` : ""}
                  </div>
                  <span class="absolute bottom-2.5 left-2.5 rounded bg-white/95 backdrop-blur px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-[var(--accent)]">
                    ${topicLabel}
                  </span>
                </div>

                <div class="p-4">
                  <h3 class="font-bold text-base text-[var(--foreground)] group-hover:text-[var(--primary)] transition-colors line-clamp-2">
                    ${article.title}
                  </h3>
                  <p class="mt-2 text-xs leading-relaxed text-[var(--muted-foreground)] line-clamp-2">
                    ${article.excerpt}
                  </p>
                </div>
              </div>

              <div class="flex items-center justify-between border-t border-[var(--border)] px-4 py-3 text-xs font-semibold text-[var(--primary)]">
                <span class="text-[var(--muted-foreground)] font-medium">🕒 ${article.readMinutes} min lectură${article.authorName ? ` · ✍️ ${article.authorName}` : ""}</span>
                <span class="inline-flex items-center gap-1 group-hover:translate-x-1 transition-transform">Citește articolul →</span>
              </div>
            </a>
          `;
        }).join("");
      }

      const shuffleBtn = document.getElementById("shuffle-recommended-btn");
      if (shuffleBtn) {
        shuffleBtn.addEventListener("click", () => {
          renderRecommendedArticles();
          if (typeof gtag === "function") {
            gtag("event", "shuffle_recommended_articles");
          }
        });
      }

      countySearch.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderCountyList();
      });

      window.addEventListener("discover-romania-articles-updated", () => {
        renderCountyList();
        renderCard();
        renderRecommendedArticles();
      });

      renderSectors();
      renderMap();
      renderCountyList();
      renderCard();
      renderRecommendedArticles();
    })();
  </script>
</body>
</html>
